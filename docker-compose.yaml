services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      target: runtime
    container_name: rate-limiter-app
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
